[SERVICE]
    Flush         1
    Daemon        off
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    storage.path  /var/lib/fluent-bit
    storage.sync  normal
    storage.checksum off
    storage.backlog.mem_limit 64M

# ---- Docker container logs (tail JSON files under /var/lib/docker/containers) ----
[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*.log
    # Skip container-cached.log — written by Docker for containers using non-json-file
    # log drivers (fluentd/local). It's a protobuf-framed cache file, not JSON, and the
    # affected containers already ship logs to us via their actual driver.
    Exclude_Path      /var/lib/docker/containers/*/container-cached.log
    Path_Key          source_file
    Parser            docker
    DB                /var/lib/fluent-bit/flb-docker.db
    Mem_Buf_Limit     50MB
    Buffer_Max_Size   1MB
    Skip_Long_Lines   On
    Refresh_Interval  5

# ---- Host systemd journal ----
[INPUT]
    Name              systemd
    Tag               host.systemd
    Path              /var/log/journal
    Read_From_Tail    On
    Strip_Underscores On

# ---- Forward protocol (for apps using fluentd/fluent-bit clients or docker log driver) ----
# Note: no Tag directive — the client-supplied tag is preserved (e.g. `app.flog` from the
# docker fluentd log driver on log-generator). The kafka outputs below route by that tag.
[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224

# ---- HTTP endpoint (curl JSON in for ad-hoc testing) ----
[INPUT]
    Name              http
    Tag               app.http
    Listen            0.0.0.0
    Port              8888

# ---- Add a constant host identifier so we can filter by emitter in Kibana/Grafana ----
[FILTER]
    Name              modify
    Match             *
    Add               host_source obsdocker

# ---- Main topic: docker container tails, host journal, and ad-hoc app inputs ----
# Match is explicit (not `app.*`) so it does NOT catch `app.flog`, which is routed below.
[OUTPUT]
    Name                     kafka
    Match_Regex              ^(docker\..*|host\..*|app\.forward|app\.http)$
    Brokers                  kafka1:9092,kafka2:9092,kafka3:9092
    Topics                   logs
    Timestamp_Key            @timestamp
    Timestamp_Format         iso8601
    Message_Key_Field        source_file
    Dynamic_Topic            Off
    Queue_Full_Retries       0
    rdkafka.compression.type snappy
    rdkafka.acks             all
    rdkafka.log.connection.close false

# ---- Dedicated topic for the synthetic log generator (tag=`app.flog` from docker fluentd driver) ----
[OUTPUT]
    Name                     kafka
    Match                    app.flog
    Brokers                  kafka1:9092,kafka2:9092,kafka3:9092
    Topics                   flog-logs
    Timestamp_Key            @timestamp
    Timestamp_Format         iso8601
    Dynamic_Topic            Off
    Queue_Full_Retries       0
    rdkafka.compression.type snappy
    rdkafka.acks             all
    rdkafka.log.connection.close false
