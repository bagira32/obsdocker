# Parser for the Docker daemon's JSON file log format:
# {"log":"...\n","stream":"stdout","time":"2024-01-01T00:00:00.123456789Z"}
[PARSER]
    Name        docker
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L
    Time_Keep   On

# Parser for Linux auditd log format:
# type=SYSCALL msg=audit(1234567890.123:456): arch=... syscall=... key="execve"
[PARSER]
    Name        auditd
    Format      regex
    Regex       ^type=(?<audit_type>[^ ]+) msg=audit\((?<ts>[0-9]+)\.[0-9]+:(?<audit_serial>[0-9]+)\): ?(?<message>.*)$
    Time_Key    ts
    Time_Format %s
