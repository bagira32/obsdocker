apiVersion: 1

datasources:
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    basicAuth: true
    basicAuthUser: elastic
    isDefault: true
    editable: true
    jsonData:
      index: logs-fluentbit-*
      timeField: "@timestamp"
      esVersion: "8.0.0"
      logMessageField: log
      logLevelField: level
      maxConcurrentShardRequests: 5
    secureJsonData:
      basicAuthPassword: ${ELASTIC_PASSWORD}
