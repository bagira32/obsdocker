apiVersion: 1

datasources:
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://es01:9200
    isDefault: true
    editable: true
    jsonData:
      index: logs-fluentbit-*
      timeField: "@timestamp"
      esVersion: "8.0.0"
      logMessageField: log
      logLevelField: level
      maxConcurrentShardRequests: 5
